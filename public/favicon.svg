<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="pen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#3F3F46" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Bezier Node Control Lines (Vector Handles) -->
  <path d="M 16 20 L 48 44" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  <circle cx="16" cy="20" r="2.5" fill="#38BDF8"/>
  <circle cx="48" cy="44" r="2.5" fill="#38BDF8"/>

  <!-- Pen Nib Body -->
  <g filter="url(#glow)">
    <path d="M 32 10 L 46 28 L 38 48 L 26 48 L 18 28 Z" fill="url(#pen-grad)"/>
    <!-- Pen Nib Tip Detail -->
    <path d="M 32 10 L 32 32" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="2.5" fill="#1E1B4B"/>
    <!-- Pen Nib Highlight -->
    <path d="M 32 10 L 46 28 L 38 48 H 32 Z" fill="#FFFFFF" fill-opacity="0.15"/>
  </g>

  <!-- Node Diamond Point at Tip -->
  <rect x="29.5" y="7.5" width="5" height="5" transform="rotate(45 32 10)" fill="#F4F4F5" stroke="#6366F1" stroke-width="1.5"/>
</svg>
